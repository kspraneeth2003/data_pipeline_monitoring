[project]
name = "dpm-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "apscheduler>=3.11.3",
    "croniter>=6.2.4",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.13.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "snowflake-connector-python>=4.7.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The backend is a flat `app` package rooted here, not an installed
# distribution, so the rootdir has to be on sys.path for `import app` to work.
pythonpath = ["."]
testpaths = ["tests"]
